[package]
name = "lowline"
version = "0.5.0"
description = "A local form editor that learns from your confirmations"
authors = ["iyulab"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.90"

[lib]
# A distinct lib name avoids a bin/lib name clash on Windows (rust-lang/cargo#8519).
name = "lowline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The device id's random bytes.
getrandom = "0.4"
# Error reports that carry no content, sent to Application Insights by a release build.
tauri-kit-credentials = "0.28.0"
tauri-kit-diagnostics = { version = "0.28.0", features = ["appinsights"] }
tauri-kit-fs = "0.28.0"
# The sidecar as a loopback helper: a per-launch token, its port, and the blocking HTTP client to it.
tauri-kit-sidecar = { version = "0.28.0", features = ["loopback-client"] }
# What this device keeps per vault, outside it, is named by the vault folder's key.
tauri-kit-state = "0.28.0"
# When to look for a newer release, the background download and what is kept between launches.
tauri-kit-update = "0.28.0"
tauri-kit-watch = "0.28.0"

# Deleting moves a file to the system's trash (Recycle Bin, Trash, freedesktop trash), where the
# person restores it from — the vault keeps no trash of its own.
trash = "5.2.9"
tauri-plugin-updater = "2.13.1"
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
# Holds the window's web view to the app's own pages below Tauri's navigation handler: frames,
# the requests of refused navigations, new windows and other programs' schemes too.
tauri-kit-webview = "0.28.0"

[dev-dependencies]
# The in-memory credential store the tests keep keys in, never the real one.
keyring-core = "1"
# Canonical paths without the `\\?\` prefix on Windows, to compare with what the trash reports.
dunce = "1"
tempfile = "3"
